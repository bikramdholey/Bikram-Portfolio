# Admin panel (Pages CMS: https://app.pagescms.org). Log in with the GitHub
# account that owns this repository. Every save is a commit, and the site
# rebuilds and publishes itself a few minutes later.
#
# Publications, CV, education, experience, awards... come from the Overleaf CV
# (synced by .github/workflows/sync-cv-from-overleaf.yml); edit those in
# Overleaf, because anything changed here in those files is overwritten.

media:
  - name: memories
    label: Memory photos (one folder per album)
    input: assets/img/memories
    output: /assets/img/memories
    categories: [image]
  - name: images
    label: Other site images
    input: assets/img
    output: /assets/img
    categories: [image]

content:
  - name: site_text
    label: Site text (About intro, Publications page)
    type: file
    path: _data/site_text.yml
    format: yaml
    fields:
      - name: about_intro
        label: About Me introduction (home page)
        type: text
      - name: publications_intro
        label: Publications page — subtitle
        type: string
      - name: featured_caption
        label: Publications page — caption under the research animation
        type: string
      - name: quote
        label: Quote at the bottom of the Publications page
        type: text
      - name: quote_signature
        label: Quote signature lines
        type: string
        list: true

  - name: memory_albums
    label: Memory album titles
    type: file
    path: _data/memory_albums.yml
    format: yaml
    list: true
    fields:
      - name: folder
        label: Folder name (as in Memory photos)
        type: string
      - name: title
        label: Title shown on the site
        type: string

  - name: socials
    label: Social / research profile links
    type: file
    path: _data/socials.yml
    format: yaml
    list: true
    fields:
      - name: name
        type: string
      - name: url
        type: string
      - name: icon
        label: Icon (Font Awesome / Academicons class)
        type: string

  - name: institution_links
    label: Institution website links (About page)
    type: file
    path: _data/institution_links.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Institution name (exactly as in the CV)
        type: string
      - name: url
        type: string

  - name: teaching
    label: Teaching page
    type: file
    path: _pages/teaching.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: string
      - name: body
        label: Page content (Markdown / HTML)
        type: text

  - name: contact
    label: Contact page
    type: file
    path: _pages/contact.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: string
      - name: body
        label: Page content (Markdown / HTML)
        type: text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: string
      - name: category
        type: string
      - name: importance
        type: number
      - name: img
        label: Thumbnail image
        type: image
        options:
          media: images
      - name: body
        label: Project page content (Markdown / HTML)
        type: text

actions:
  - name: sync-cv
    label: Sync CV & publications from Overleaf now
    workflow: sync-cv-from-overleaf.yml
    ref: main
    cancelable: false
  - name: deploy
    label: Rebuild & publish the website
    workflow: deploy.yml
    ref: main
    cancelable: false
