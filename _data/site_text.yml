about_intro: I’m Bikram Dholey, a Ph.D. Scholar in Mathematics at Jadavpur University and former Assistant Professor at Brainware University, Kolkata. I specialize in wave propagation, smart materials, piezoelectricity, elastodynamics, and vibrations, developing mathematical models and computational simulations to study wave behavior in smart composite structures for applications in aerospace, biomedicine, and structural health monitoring. Passionate about both research and teaching, I integrate rigorous theory with practical applications to spark curiosity and analytical thinking. My teaching approach blends interactive learning, innovative pedagogy, and mentorship, encouraging students to think critically and tackle complex problems. I have guided postgraduate research, contributed to curriculum design, and promoted collaborative learning in mathematics. Trained in Matlab, Mathematica, Python, and LaTeX, I bridge classical mathematical theory with modern computational techniques. My academic interests also span differential equations, graph theory, and manifold theory, providing a strong foundation for my research. My vision is to advance mathematical sciences, foster interdisciplinary collaboration, and inspire the next generation of scholars to solve real‑world challenges through the power of mathematics.
publications_intro: Research work and scientific contributions by **Bikram Dholey**.
quote: Waves in complex materials reveal the harmony between mathematics and physics — my research explores this deep connection.
