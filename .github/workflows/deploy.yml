name: Deploy site

# Builds the site and publishes it to:
#   - Netlify (site root), when the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets are set
#   - GitHub Pages at https://bikramdholey.github.io/Bikram-Portfolio/ (gh-pages branch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: false

      - name: Install dependencies 🧱
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick build-essential
          gem install bundler
          bundle install

      - name: Optimize memory photos 🖼️
        run: |
          pip install --quiet Pillow pillow-heif
          python3 _scripts/optimize_memory_photos.py

      - name: Build for Netlify 🔧
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Deploy to Netlify 🌐
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets not set; skipping Netlify deploy."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir=_site --site "$NETLIFY_SITE_ID" \
            --message "Deploy ${GITHUB_SHA::7}"

      - name: Build for GitHub Pages 🔧
        run: |
          printf 'url: "https://bikramdholey.github.io"\nbaseurl: /Bikram-Portfolio\n' > "$RUNNER_TEMP/_config.pages.yml"
          JEKYLL_ENV=production bundle exec jekyll build \
            --config "_config.yml,$RUNNER_TEMP/_config.pages.yml" --destination _site_pages
          # serve the built site as-is; stops GitHub Pages running Jekyll on it again
          touch _site_pages/.nojekyll

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site_pages
