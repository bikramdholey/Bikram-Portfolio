name: Deploy site

# Builds the site once and publishes it to:
#   - GitHub Pages at https://bikramdholey.github.io/ (gh-pages branch; main address)
#   - Netlify (bikram-dholey.netlify.app), when the NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets are set

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      payload:
        description: Sent by the Admin panel (Pages CMS) button; not used
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: false

      - name: Install dependencies 🧱
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick build-essential
          gem install bundler
          bundle install

      - name: Optimize memory photos 🖼️
        run: |
          pip install --quiet Pillow pillow-heif
          python3 _scripts/optimize_memory_photos.py

      - name: Build site 🔧
        run: |
          JEKYLL_ENV=production bundle exec jekyll build
          # serve the built site as-is; stops GitHub Pages running Jekyll on it again
          touch _site/.nojekyll

      - name: Deploy to Netlify 🌐
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets not set; skipping Netlify deploy."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir=_site --site "$NETLIFY_SITE_ID" \
            --message "Deploy ${GITHUB_SHA::7}"

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
