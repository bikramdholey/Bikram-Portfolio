name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths: *same-as-above
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node.js ✅
        uses: actions/setup-node@v4
        with:
          node-version: "20"      # pick a stable LTS you want
          cache: "npm"

      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Install system deps (ImageMagick) 🔧
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install JS deps (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install and Build Jekyll 🔧
        run: |
          pip3 install --upgrade nbconvert || true
          export JEKYLL_ENV=production
          bundle exec jekyll build --verbose

      - name: Purge unused CSS 🧹
        run: |
          # Use npx so you don't rely on global installs. Adjust args to match your config.
          if [ -f package.json ]; then
            npx purgecss -c purgecss.config.js
          else
            npx purgecss -c purgecss.config.js || true
          fi

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
