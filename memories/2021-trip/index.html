;justify-content:center}.trip-lightbox[hidden]{display:none}.trip-lb-stage img{max-width:90vw;max-height:85vh;border-radius:8px;display:block}.trip-lb-close,.trip-lb-nav{position:absolute;background:rgba(255,255,255,0.12);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:26px;line-height:1;cursor:pointer}.trip-lb-close:hover,.trip-lb-nav:hover{background:rgba(255,255,255,0.25)}.trip-lb-close{top:16px;right:16px;font-size:20px}.trip-lb-prev{left:16px}.trip-lb-next{right:16px}.trip-lb-count{position:absolute;bottom:16px;color:#ddd;font-size:.9rem}@media(max-width:576px){.trip-photos{grid-template-columns:repeat(2,1fr);gap:10px}.trip-lb-nav{top:auto;bottom:12px}}</style> <script>
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll(".trip-item"));
    var box = document.querySelector(".trip-lightbox");
    if (!items.length || !box) return;

    var stage = box.querySelector(".trip-lb-stage");
    var count = box.querySelector(".trip-lb-count");
    var current = 0;

    function show(i) {
      current = (i + items.length) % items.length;
      var item = items[current];
      stage.innerHTML = "";
      var el = document.createElement("img");
      el.src = item.dataset.src;
      el.alt = "";
      stage.appendChild(el);
      count.textContent = current + 1 + " / " + items.length;
    }

    function open(i) {
      show(i);
      box.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function close() {
      stage.innerHTML = "";
      box.hidden = true;
      document.body.style.overflow = "";
    }

    items.forEach(function (item, i) {
      item.addEventListener("click", function () {
        open(i);
      });
    });

    box.querySelector(".trip-lb-close").addEventListener("click", close);
    box.querySelector(".trip-lb-prev").addEventListener("click", function () {
      show(current - 1);
    });
    box.querySelector(".trip-lb-next").addEventListener("click", function () {
      show(current + 1);
    });
    box.addEventListener("click", function (e) {
      if (e.target === box) close();
    });

    document.addEventListener("keydown", function (e) {
